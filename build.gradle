plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
    }
    maven {
        name = 'WispForest'
        url = 'https://maven.wispforest.io/releases/'
    }
    maven {
        name = 'Sinytra'
        url = 'https://maven.su5ed.dev/releases'
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = layout.projectDirectory.dir('.run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            gameDirectory = layout.projectDirectory.dir('.run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            gameDirectory = layout.projectDirectory.dir('.run/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath, '--existing',
                    file('src/main/resources').absolutePath
        }
    }

    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "io.wispforest:owo-lib-neoforge:${owo_version}"
    annotationProcessor "io.wispforest:owo-lib-neoforge:${owo_version}"
    accessTransformers "io.wispforest:owo-lib-neoforge:${owo_version}"
    interfaceInjectionData "io.wispforest:owo-lib-neoforge:${owo_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets {
    benchmark {
        java.srcDir 'src/benchmark/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    modelgen {
        java.srcDir 'src/modelgen/java'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            owo_version            : owo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_display_url        : mod_display_url,
            mod_issue_tracker      : mod_issue_tracker,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version.toInteger()
}


tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('projectileCollisionBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs projectile-heavy swept model-cuboid collision microbenchmarks.'
    dependsOn tasks.named('benchmarkClasses')
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'com.jvn.lodged.collision.ProjectileCollisionBenchmark'
    jvmArgs '-Xms256m', '-Xmx256m'
}

tasks.register('generateVanillaModelHitboxes', JavaExec) {
    group = 'build setup'
    description = 'Bakes vanilla client model layers into server-safe collision data.'
    dependsOn tasks.named('modelgenClasses')
    classpath = sourceSets.modelgen.runtimeClasspath
    classpath += fileTree(layout.buildDirectory.dir('moddev/artifacts')) {
        include '*client-extra*.jar'
    }
    mainClass = 'com.jvn.lodged.modelgen.VanillaModelHitboxGenerator'
    args layout.projectDirectory.file('src/main/resources/assets/lodged/model_hitboxes.tsv').asFile.absolutePath
    workingDir layout.buildDirectory.dir('modelgen')
    doFirst { workingDir.mkdirs() }
}
tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = rootProject.file('repo').toURI()
        }
    }
}
